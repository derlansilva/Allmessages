spring.application.name=allMessages
server.port=8081

# URL de conexão (ajuste o localhost e o nome do banco 'all_messages_db')
spring.datasource.url=jdbc:postgresql://localhost:5432/all_messages_db
spring.datasource.username=postgres
spring.datasource.password=03394579

# Hibernate settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Configurações Básicas do Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=allmessages-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.producer.key-serializer=org.apache.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

